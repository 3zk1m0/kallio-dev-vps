name: Update flake.lock

# system.autoUpgrade on the VPS rebuilds against the flake.lock committed
# here — without this workflow the nightly "upgrade" would rebuild the same
# pinned nixpkgs forever. The weekly PR is merged manually; a ntfy push
# (NTFY_TOKEN secret) says when one is waiting.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/update-flake-lock@v28
        id: update
        with:
          # PAT so the PR triggers the CI check job (PRs opened with the
          # default github.token never trigger workflows). Falls back to
          # github.token: the PR still opens but must be merged manually.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
          pr-title: "chore: update flake.lock"
          pr-labels: dependencies

      - name: Notify via ntfy
        if: steps.update.outputs.pull-request-number != ''
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: |
          curl -fsS -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: flake.lock update ready to merge" \
            -H "Tags: package" \
            -d "https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER" \
            https://ntfy.kallio.dev/alerts
