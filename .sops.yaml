# sops configuration — replace the placeholder with the public half of the
# age key you generate during setup (see README "Secrets" section):
#
#   age-keygen -o key.txt        # public key is printed as "age1..."
#
keys:
  - &vps age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
creation_rules:
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *vps
